<style>

<body>

<section id="auth" class="screen center">
  <div class="auth-wrap">
    <div class="brand">Nexa<span>Chat</span></div>
    <div class="tag">مراسلة • أصدقاء • لحظات • مجتمع</div>
    <div class="auth-card">
      <div class="tabs"><button id="tabSignup" class="on">حساب جديد</button><button id="tabLogin">تسجيل الدخول</button></div>
      <div id="authErr" class="msg err"></div><div id="authOk" class="msg ok"></div>
      <div id="signupBox">
        <div class="field"><label>البريد الإلكتروني</label><input id="suEmail" type="email" autocomplete="email" placeholder="example@gmail.com"></div>
        <div class="field"><label>كلمة المرور</label><input id="suPass" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل"></div>
        <div class="field"><label>Nexa ID</label><input id="suUser" placeholder="Nour123" maxlength="20"></div>
        <div class="field"><label>الاسم الظاهر</label><input id="suName" placeholder="نور الدين" maxlength="30"></div>
        <button id="createBtn" class="primary">إنشاء الحساب</button>
        <button id="forgotFromSignup" class="ghost" style="width:100%;margin-top:8px">نسيت كلمة المرور؟</button>
      </div>
      <div id="loginBox" class="hidden">
        <div class="field"><label>البريد الإلكتروني</label><input id="liEmail" type="email" autocomplete="email" placeholder="example@gmail.com"></div>
        <div class="field"><label>كلمة المرور</label><input id="liPass" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
        <button id="loginBtn" class="primary">دخول إلى NexaChat</button>
        <button id="forgotBtn" class="ghost" style="width:100%;margin-top:8px">نسيت كلمة المرور؟</button>
      </div>
    </div>
  </div>
</section>

<section id="app" class="screen">
  <header class="top"><div class="top-row"><div id="pageTitle" class="top-title">المحادثات</div><button id="topSearch" class="top-action">⌕</button><button id="topBell" class="top-action" style="position:relative">🔔<span id="notifBadge" class="badge hidden">0</span></button></div></header>
  <main class="main">
    <section id="pageChats" class="page active">
      <div id="storiesArea"></div>
      <div class="section-head"><h2>المحادثات</h2><button id="newChatBtn" class="secondary">＋ محادثة</button></div>
      <div id="chatList" class="card"></div>
    </section>

    <section id="pageExplore" class="page">
      <div class="section-head"><h2>استكشاف</h2><button id="postBtn" class="secondary">＋ منشور</button></div>
      <div id="composer" class="card composer hidden">
        <div class="composer-row"><div id="composerAvatar" class="avatar small"></div><textarea id="postText" placeholder="إيه الجديد عندك؟"></textarea></div><div class="field" style="margin-top:10px"><label>صورة للمنشور (اختياري)</label><input id="postImageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><input id="postImageUrl" placeholder="رابط صورة (اختياري)" style="margin-top:8px"></div>
        <div style="display:flex;gap:8px;margin-top:10px"><button id="publishBtn" class="primary" style="flex:1">نشر</button><button id="cancelPost" class="secondary">إلغاء</button></div>
      </div>
      <div id="feed"></div>
    </section>

    <section id="pageFriends" class="page">
      <div class="section-head"><h2>الأصدقاء</h2><button id="findFriend" class="secondary">🔎 بحث</button></div>
      <div id="friendList" class="card"></div>
      <div class="section-head" style="margin-top:22px"><h2>طلبات التواصل</h2></div>
      <div id="requestList" class="card"></div>
    </section>

    <section id="pageProfile" class="page">
      <div id="profileCard" class="card" style="overflow:hidden"></div>
      <div class="section-head"><h2>منشوراتي</h2></div><div id="myPosts"></div>
    </section>

    <section id="pageNotifications" class="page"><div class="section-head"><h2>الإشعارات</h2><button id="clearNotifs" class="secondary">مسح</button></div><div id="notifList" class="card"></div></section>
    <section id="pageSearch" class="page"><div class="section-head"><h2>بحث Nexa</h2></div><div class="searchbar"><input id="globalSearch" placeholder="ابحث بالـID أو الاسم"><button id="globalSearchBtn">⌕</button></div><div id="searchResults"></div></section>
  </main>
  <nav class="nav">
    <button data-page="chats" class="active"><i>💬</i>المحادثات</button>
    <button data-page="explore"><i>🌐</i>استكشاف</button>
    <button data-page="friends"><i>👥</i>الأصدقاء</button>
    <button data-page="profile"><i>👤</i>حسابي</button>
  </nav>
</section>

<section id="chatScreen">
  <div class="chat-head"><button id="chatBack" class="back">‹</button><button id="chatAvatar" class="avatar small" aria-label="فتح الملف الشخصي"></button><div class="item-main"><div id="chatName" class="item-name"></div><div id="chatStatus" class="item-sub">متصل الآن</div></div><button id="chatMore" class="top-action">⋮</button></div>
  <div id="chatBody" class="chat-body"></div>
  <div class="chat-compose"><button id="attachBtn" class="attach" title="إرسال صورة أو ملف">📎</button><input id="chatInput" placeholder="اكتب رسالة..."><button id="voiceBtn" title="تسجيل صوتي">🎙️</button><button id="sendBtn">➤</button><input id="chatFileInput" type="file" hidden accept="image/jpeg,image/png,image/webp,image/gif,audio/webm,audio/ogg,audio/mpeg,audio/mp4,audio/wav,application/pdf,text/plain"></div>
</section>

<div id="modal" class="modal"><div class="sheet"><div class="sheet-head"><b id="modalTitle">Nexa</b><button id="modalClose" class="close">×</button></div><div id="modalBody"></div></div></div>
<div id="storyView" class="story-view"><div class="story-progress" id="storyProgress"></div><div class="story-bar"><button id="storyPrev" class="story-nav" title="السابق">‹</button><div id="storyWho" style="flex:1;font-weight:800"></div><button id="storyNext" class="story-nav" title="التالي">›</button><button id="storyClose" class="story-close">إغلاق</button></div><div id="storyContent" class="story-content"></div><div class="story-footer"><div id="storyTime" class="muted"></div></div></div>
<div id="toast" class="toast"></div>

<script>

function editProfile(){const u=me();openModal('تعديل الحساب',`<div class="field"><label>الاسم الظاهر</label><input id="editName" value="${esc(u.display_name)}"></div><div class="field"><label>النبذة</label><textarea id="editBio" maxlength="500">${esc(u.bio||'')}</textarea></div><div class="field"><label>صورة البروفايل</label><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><div class="field"><label>غلاف البروفايل</label><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><button id="saveProfile" class="primary">حفظ التعديلات</button>`);$('saveProfile').onclick=async()=>{const n=$('editName').value.trim(),bio=$('editBio').value.trim();if(!n)return toast('الاسم مطلوب');let avatar_url=u.avatar_url||null,cover_url=u.cover_url||null;for(const [id,kind] of [['avatarFile','avatar'],['coverFile','cover']]){const file=$(id).files?.[0];if(!file)continue;if(file.size>8*1024*1024)return toast('الصورة أكبر من 8 ميجابايت');const path=`${session.user.id}/${kind}/${crypto.randomUUID()}.${fileExt(file)}`;const up=await sb.storage.from('nexa-profile-media').upload(path,file,{upsert:false,contentType:file.type});if(up.error)return toast('تعذر رفع الصورة');const url=sb.storage.from('nexa-profile-media').getPublicUrl(path).data.publicUrl;if(kind==='avatar')avatar_url=url;else cover_url=url;}const {data,error}=await sb.from('profiles').update({display_name:n,bio,avatar_url,cover_url}).eq('id',session.user.id).select('*').single();if(error)return toast('تعذر حفظ البيانات');profile=data;cache.profiles.set(data.id,data);closeModal();renderAll();toast('تم تحديث الحساب ✓');};}
async function settings(){openModal('إعدادات NexaChat',`<div class="option-grid"><button id="privacyOpt" class="option">🔐<b>الخصوصية</b><small class="muted">إخفاء القصص والحظر</small></button><button id="notifOpt" class="option">🔔<b>الإشعارات</b><small class="muted">تشغيل أو إيقاف إشعارات Nexa</small></button><button id="blockedOpt" class="option">🚫<b>المحظورون</b><small class="muted">إدارة الحسابات</small></button><button id="aboutOpt" class="option">ℹ️<b>عن Nexa</b><small class="muted">من تطوير نور الدين أيمن</small></button></div>`);$('privacyOpt').onclick=storyPrivacySettings;$('notifOpt').onclick=notificationSettings;$('blockedOpt').onclick=showBlocked;$('aboutOpt').onclick=()=>openModal('عن Nexa',`<div style="text-align:center;padding:18px"><div style="font-size:42px">💜</div><h2>NexaChat</h2><p class="muted">تواصل • أصدقاء • قصص • منشورات</p><p><b>من تطوير نور الدين أيمن</b></p></div>`);}
async function notificationSettings(){const enabled=localStorage.getItem('nexa_notifications_enabled')!=='0';const sound=soundEnabled();openModal('إعدادات الإشعارات والصوت',`<div class="card" style="padding:8px 16px"><div class="sound-row"><div><b>إشعارات NexaChat</b><div class="muted" style="font-size:13px;margin-top:4px">تشغيل أو إيقاف إشعارات التفاعل.</div></div><button id="notifToggle" class="secondary">${enabled?'🔔 مفتوحة':'🔕 مقفولة'}</button></div><div class="sound-row" style="border-bottom:0"><div><b>أصوات التنبيه</b><div class="muted" style="font-size:13px;margin-top:4px">صوت للرسائل الجديدة والتفاعلات.</div></div><button id="soundToggle" class="secondary">${sound?'🔊 مفعلة':'🔇 مقفولة'}</button></div></div>`);$('notifToggle').onclick=async()=>{const next=!enabled;localStorage.setItem('nexa_notifications_enabled',next?'1':'0');if(next){await subscribeNotifications();await loadNotifications();}else if(notifChannel){await sb.removeChannel(notifChannel);notifChannel=null;updateNotifBadge();}closeModal();toast(next?'الإشعارات اتفتحت ✓':'الإشعارات اتقفلت ✓');};$('soundToggle').onclick=()=>{const next=!soundEnabled();localStorage.setItem('nexa_sound_enabled',next?'1':'0');unlockAudio();if(next)playNotifySound('normal');notificationSettings();};}
async function storyPrivacySettings(){const ids=[...cache.friends];if(!ids.length)return openModal('خصوصية القصص','<div class="muted" style="padding:20px;text-align:center">أضف أصدقاء الأول عشان تقدر تمنع أشخاص معينين من مشاهدة قصصك.</div>');const {data:hidden}=await sb.from('story_hidden_users').select('hidden_user_id').eq('story_author_id',session.user.id);const hiddenSet=new Set((hidden||[]).map(x=>x.hidden_user_id));const html=`<p class="muted">اختار الأصدقاء اللي مش عايزهم يشوفوا قصصك.</p><div id="storyPrivacyList">${ids.map(id=>{const u=cache.profiles.get(id)||{};return `<label class="person-item" style="cursor:pointer"><input type="checkbox" data-hide-story="${id}" ${hiddenSet.has(id)?'checked':''} style="width:20px;height:20px"><div>${avatarHTML(u,true)}</div><div class="item-main"><b>${esc(u.display_name||'Nexa user')}</b><div class="item-sub">@${esc(u.username||'user')}</div></div></label>`}).join('')}</div><button id="saveStoryPrivacy" class="primary" style="margin-top:12px">حفظ الخصوصية</button>`;openModal('خصوصية القصص',html);$('saveStoryPrivacy').onclick=async()=>{const selected=[...document.querySelectorAll('[data-hide-story]:checked')].map(x=>x.dataset.hideStory);await sb.from('story_hidden_users').delete().eq('story_author_id',session.user.id);if(selected.length){const {error}=await sb.from('story_hidden_users').insert(selected.map(id=>({story_author_id:session.user.id,hidden_user_id:id})));if(error)return toast('تعذر حفظ الخصوصية');}closeModal();toast('تم حفظ خصوصية القصص ✓');};}
async function showBlocked(){const {data,error}=await sb.from('user_blocks').select('blocked_id').eq('blocker_id',session.user.id);if(error)return toast('تعذر تحميل المحظورين');const html=(data||[]).map(x=>{const u=cache.profiles.get(x.blocked_id);return `<div class="person-item"><div class="item-main"><b>@${esc(u?.username||'user')}</b></div><button class="secondary" data-unblock="${x.blocked_id}">إلغاء الحظر</button></div>`}).join('')||'<div class="muted" style="padding:20px;text-align:center">مفيش حسابات محظورة.</div>';openModal('الحسابات المحظورة',html);document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{await sb.from('user_blocks').delete().eq('blocker_id',session.user.id).eq('blocked_id',b.dataset.unblock);showBlocked();});}
function toggleTheme(){cache.theme=cache.theme==='dark'?'light':'dark';localStorage.setItem('nexa_theme',cache.theme);applyTheme();toast(cache.theme==='dark'?'الوضع الليلي مفعل':'الوضع النهاري مفعل');}
function applyTheme(){document.body.classList.toggle('dark',cache.theme==='dark');}
async function blockUser(id){const {error}=await sb.from('user_blocks').upsert({blocker_id:session.user.id,blocked_id:id});if(error)return toast('تعذر حظر الحساب');toast('تم حظر الحساب');closeModal();}
async function adminPanel(){
  if(!(await isOwnerAdmin())) return toast('غير مصرح');
  const [{data:users,error:ue},{data:reports,error:re}] = await Promise.all([sb.rpc('admin_list_users'),sb.rpc('admin_list_reports')]);
  if(ue||re) return toast('تعذر تحميل مركز المالك');
  const rs=reports||[], us=users||[];
  const html=`<div class="section-head"><h3>المستخدمون (${us.length})</h3><button id="adminRefresh" class="secondary">تحديث</button></div>
  <div class="searchbar"><input id="adminUserSearch" placeholder="بحث بالإيميل أو Nexa ID أو الاسم"><button id="adminSearchBtn">⌕</button></div>
  <div id="adminUsers">${adminUsersHTML(us)}</div>
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <div class="section-head"><h3>البلاغات (${rs.filter(x=>x.status==='open').length} مفتوح)</h3></div>
  <div id="adminReports">${adminReportsHTML(rs)}</div>`;
  openModal('🛡️ مركز مالك NexaChat',html);
  $('adminRefresh').onclick=adminPanel;
  const filter=()=>{const q=$('adminUserSearch').value.trim().toLowerCase();$('adminUsers').innerHTML=adminUsersHTML(us.filter(u=>[u.email,u.username,u.display_name].some(v=>String(v||'').toLowerCase().includes(q))))};
  $('adminSearchBtn').onclick=filter; $('adminUserSearch').oninput=filter;
  bindAdminActions();
}
function adminUsersHTML(us){return us.map(u=>`<div class="person-item card" style="margin-bottom:8px;padding:11px"><div class="avatar small">${esc(initials(u.display_name||u.username))}</div><div class="item-main"><div class="item-name">${esc(u.display_name||'بدون اسم')}</div><div class="item-sub">@${esc(u.username||'user')} • ${esc(u.email||'')}<br>${new Date(u.created_at).toLocaleDateString('ar-EG')}</div></div>${u.banned?`<button class="secondary" data-unban-admin="${u.user_id}">فك الحظر</button>`:`<button class="block" data-ban-admin="${u.user_id}">حظر</button>`}</div>`).join('')||'<div class="muted" style="padding:20px;text-align:center">لا توجد حسابات.</div>'; }
function adminReportsHTML(rs){return rs.map(r=>`<div class="card" style="padding:13px;margin-bottom:9px"><b>${r.kind==='post'?'📝 بلاغ منشور':'👤 بلاغ حساب'} — ${esc(r.reason)}</b><div class="item-sub">${new Date(r.created_at).toLocaleString('ar-EG')} • ${esc(r.status)}</div><p style="white-space:pre-wrap">${esc(r.details||'بدون تفاصيل')}</p><div class="result-actions"><button class="secondary" data-report-review="${r.kind}|${r.id}">مراجعة</button>${r.kind==='post'?`<button class="block" data-remove-post="${r.target_id}">إزالة المنشور</button>`:''}</div></div>`).join('')||'<div class="muted" style="padding:20px;text-align:center">لا توجد بلاغات.</div>'; }
function bindAdminActions(){
 document.querySelectorAll('[data-ban-admin]').forEach(b=>b.onclick=async()=>{const reason=prompt('سبب الحظر؟')||'حظر إداري';const {error}=await sb.rpc('admin_ban_user',{p_user_id:b.dataset.banAdmin,p_reason:reason,p_expires_at:null});if(error)return toast('فشل الحظر');toast('تم حظر الحساب ✓');adminPanel();});
 document.querySelectorAll('[data-unban-admin]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('admin_unban_user',{p_user_id:b.dataset.unbanAdmin});if(error)return toast('فشل فك الحظر');toast('تم فك الحظر ✓');adminPanel();});
 document.querySelectorAll('[data-remove-post]').forEach(b=>b.onclick=async()=>{const reason=prompt('سبب إزالة المنشور؟')||'إزالة بواسطة المالك';const {error}=await sb.rpc('admin_moderate_post',{p_post_id:b.dataset.removePost,p_visibility:'removed',p_reason:reason});if(error)return toast('فشل إزالة المنشور');toast('تمت إزالة المنشور ✓');adminPanel();});
 document.querySelectorAll('[data-report-review]').forEach(b=>b.onclick=async()=>{const [kind,id]=b.dataset.reportReview.split('|');const {error}=await sb.rpc('admin_set_report_status',{p_kind:kind,p_id:id,p_status:'reviewed'});if(error)return toast('فشل تحديث البلاغ');toast('تمت مراجعة البلاغ ✓');adminPanel();});
}

function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('open');try{if(!history.state?.modal)history.pushState({...history.state,nexa:true,page:currentPage,modal:true},'',location.href);}catch(e){}}
function closeModal(fromHistory=false){$('modal').classList.remove('open');$('modalBody').innerHTML='';if(!fromHistory&&history.state?.modal){try{history.back();}catch(e){}}}
function addFriendSearch(){go('search');$('globalSearch').focus();}
function attach(){$('chatFileInput').click();}
function updateNotifBadge(){if(localStorage.getItem('nexa_notifications_enabled')==='0'){const b=$('notifBadge');if(b)b.classList.add('hidden');return;}const count=cache.notifications.filter(n=>!n.read_at).length;const b=$('notifBadge');if(!b)return;b.textContent=count>99?'99+':count;b.classList.toggle('hidden',count===0);}
function renderNotifications(){const n=$('notifList'),rows=cache.notifications;if(!rows.length){n.innerHTML='<div style="padding:30px;text-align:center" class="muted">مفيش إشعارات جديدة.</div>';updateNotifBadge();return;}n.innerHTML=rows.map(x=>{const a=cache.profiles.get(x.actor_id),icon=x.type==='friend_request'?'👥':x.type==='friend_accepted'?'🤝':x.type==='story_reaction'?'❤️':x.type==='post_like'?'❤️':x.type==='post_comment'?'💬':'🔔';return `<div class="person-item notification-item" data-notification="${x.id}" style="background:${x.read_at?'transparent':'var(--soft)'};cursor:pointer"><div class="avatar small">${a?.avatar_url?`<img src="${esc(a.avatar_url)}">`:icon}</div><div class="item-main"><div class="item-name">${esc(x.title)}</div><div class="item-sub">${esc(x.body||'')}</div><div class="time">${timeAgo(x.created_at)}</div></div></div>`}).join('');
  n.querySelectorAll('[data-notification]').forEach(el=>el.onclick=async()=>{const x=cache.notifications.find(v=>v.id===el.dataset.notification);if(!x)return;await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',x.id);if(x.type==='story_reaction')return viewStory(x.entity_id);if(x.type==='friend_request'||x.type==='friend_accepted'){go('friends');return;}if(x.type==='post_like'||x.type==='post_comment'){go('explore');return;}});updateNotifBadge();}
async function markNotificationsRead(){const unread=cache.notifications.filter(n=>!n.read_at).map(n=>n.id);if(unread.length)await sb.from('notifications').update({read_at:new Date().toISOString()}).in('id',unread);await loadNotifications();renderNotifications();}

function bind(){
 window.addEventListener('pointerdown',unlockAudio,{once:false,passive:true});
 $('tabSignup').onclick=()=>switchAuth('signup');$('tabLogin').onclick=()=>switchAuth('login');$('createBtn').onclick=createAccount;$('loginBtn').onclick=login;$('forgotBtn').onclick=forgot;$('forgotFromSignup').onclick=forgot;
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('topSearch').onclick=()=>go('search');$('topBell').onclick=()=>go('notifications');$('clearNotifs').onclick=async()=>{const ids=cache.notifications.map(n=>n.id);if(ids.length)await sb.from('notifications').delete().in('id',ids);await loadNotifications();renderNotifications();};$('newChatBtn').onclick=newChat;$('findFriend').onclick=addFriendSearch;$('globalSearchBtn').onclick=globalSearch;$('globalSearch').onkeydown=e=>{if(e.key==='Enter')globalSearch()};$('postBtn').onclick=()=>{$('composer').classList.toggle('hidden');$('postText').focus()};$('cancelPost').onclick=()=>{$('composer').classList.add('hidden')};$('publishBtn').onclick=publish;$('chatBack').onclick=closeChat;$('sendBtn').onclick=sendMessage;$('chatInput').onkeydown=e=>{if(e.key==='Enter')sendMessage()};$('attachBtn').onclick=attach;$('chatFileInput').onchange=e=>{const f=e.target.files?.[0];if(f)uploadChatFile(f);e.target.value='';};$('voiceBtn').onclick=toggleVoice;$('chatAvatar').onclick=()=>selectedChatUser&&openPublicProfile(selectedChatUser.id);$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('storyClose').onclick=()=>$('storyView').classList.remove('open');
}
function newChat(){go('search');$('globalSearch').focus();toast('ابحث عن Nexa ID للشخص اللي عايز تكلمه');}
async function boot(){
  bind();applyTheme();
  const {data:{session:s}}=await sb.auth.getSession();session=s;
  sb.auth.onAuthStateChange(async(event,s2)=>{session=s2;if(event==='SIGNED_OUT'){profile=null;$('app').style.display='none';$('chatScreen').style.display='none';$('auth').style.display='flex';switchAuth('login');} });
  if(session){ownerAdmin=await isOwnerAdmin(); await startApp();}else{await new Promise(r=>setTimeout(r,700));const retry=await sb.auth.getSession();if(retry.data?.session){session=retry.data.session;ownerAdmin=await isOwnerAdmin();await startApp();}else{$('auth').style.display='flex';switchAuth('login');}}
}
boot();
})();
</script>
