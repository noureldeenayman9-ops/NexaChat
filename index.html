<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}input,textarea{outline:0}body.dark{--bg:#10121a;--card:#191c27;--text:#f4f5fb;--muted:#9ca3b5;--line:#2b2f3c;--soft:#29254b;--shadow:0 8px 28px rgba(0,0,0,.25)}
.hidden{display:none!important}.screen{min-height:100vh}.center{display:flex;align-items:center;justify-content:center}.toast{position:fixed;z-index:9999;left:50%;bottom:90px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#20232d;color:#fff;padding:12px 18px;border-radius:16px;max-width:90%;text-align:center;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}

#auth{padding:28px 18px;background:linear-gradient(160deg,#f7f8fd,#eeecff)}.auth-wrap{width:100%;max-width:600px;margin:auto}.brand{text-align:center;font-size:39px;font-weight:900;letter-spacing:-1px;margin:20px 0 8px}.brand b{color:var(--brand)}.tag{text-align:center;color:var(--muted);margin-bottom:25px}.auth-card{background:#fff;border-radius:34px;padding:24px;box-shadow:var(--shadow)}.tabs{display:flex;background:#eef0f5;padding:5px;border-radius:20px;margin-bottom:25px}.tabs button{width:50%;padding:14px;border-radius:16px;background:transparent;color:#737a8b}.tabs .on{background:#fff;color:var(--brand);font-weight:800;box-shadow:0 3px 12px #0000000d}.field{margin:0 0 16px}.field label{display:block;margin:0 8px 7px;font-weight:750;color:#626a7c}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:15px 16px;font-size:16px}.field textarea{min-height:90px;resize:vertical}.primary{width:100%;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border-radius:18px;padding:16px;font-weight:800;font-size:17px}.secondary{background:var(--soft);color:var(--brand);border-radius:14px;padding:11px 14px;font-weight:750}.ghost{background:transparent;color:var(--brand);padding:10px}.msg{border-radius:14px;padding:11px 13px;margin-bottom:14px;display:none}.msg.err{background:#fff0f2;color:#b52338}.msg.ok{background:#eafaf2;color:#127849}

#app{display:none;background:var(--bg);padding-bottom:76px}.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px}.top-row{display:flex;align-items:center;gap:10px}.top-title{font-size:24px;font-weight:900;flex:1}.top-action{width:42px;height:42px;border-radius:14px;background:var(--soft);color:var(--brand);font-size:19px}.main{max-width:760px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}.section-head{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 13px}.section-head h2{font-size:19px;margin:0}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
/* stories */
.story-row{display:flex;gap:12px;overflow:auto;padding:3px 2px 12px}.story{min-width:72px;text-align:center}.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#f8a,#6a50e9,#23c5c9);margin:auto}.story-ring>div{height:100%;width:100%;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}.story small{display:block;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.story.add .story-ring{background:var(--soft);color:var(--brand)}
/* chat list */
.chat-item,.person-item,.request-item,.group-item{display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid var(--line)}.chat-item:last-child,.person-item:last-child,.request-item:last-child,.group-item:last-child{border-bottom:0}.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#6c59e8,#9a8df5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto}.avatar.small{width:43px;height:43px;font-size:14px}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.item-main{min-width:0;flex:1}.item-name{font-weight:850}.item-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.time{font-size:11px;color:var(--muted)}.pill{font-size:11px;background:var(--soft);color:var(--brand);padding:4px 8px;border-radius:99px}
/* search/explore */
.searchbar{display:flex;gap:8px;margin-bottom:15px}.searchbar input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:17px;padding:14px}.searchbar button{width:48px;border-radius:15px;background:var(--brand);color:#fff}.result-card{padding:15px;margin-bottom:10px}.result-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.result-actions button{border-radius:12px;padding:9px 12px}.follow{background:var(--brand);color:#fff}.block{background:#fff0f2;color:var(--danger)}

.composer{padding:14px;margin-bottom:14px}.composer-row{display:flex;gap:10px;align-items:center}.composer textarea{flex:1;border:0;background:var(--bg);color:var(--text);border-radius:17px;padding:12px;min-height:48px;resize:none}.post{padding:15px;margin-bottom:13px}.post-head{display:flex;align-items:center;gap:10px}.post-body{white-space:pre-wrap;line-height:1.6;margin:13px 0}.post-media{width:100%;max-height:400px;object-fit:cover;border-radius:16px}.post-actions{display:flex;gap:5px;border-top:1px solid var(--line);padding-top:8px}.post-actions button{flex:1;background:transparent;color:var(--muted);padding:9px;border-radius:12px}.post-actions button.active{color:var(--brand);background:var(--soft)}.comments{border-top:1px solid var(--line);margin-top:5px;padding-top:9px}.comment{font-size:13px;margin:7px 0}.comment b{margin-left:4px}
/* profile */
.profile-cover{height:120px;border-radius:24px 24px 0 0;background:linear-gradient(135deg,#5b4bdc,#24b9c7)}.profile-body{padding:0 18px 20px}.profile-avatar{width:92px;height:92px;border:5px solid var(--card);margin-top:-45px}.profile-id{color:var(--muted);direction:ltr;text-align:right}.stats{display:flex;gap:8px;margin:16px 0}.stat{flex:1;text-align:center;background:var(--bg);padding:10px;border-radius:15px}.stat b{display:block;font-size:18px}.profile-actions{display:flex;gap:8px;flex-wrap:wrap}.profile-actions button{flex:1;min-width:120px}
/* nav */
.nav{position:fixed;z-index:80;bottom:0;right:0;left:0;height:76px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:transparent;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button i{font-style:normal;font-size:23px}.nav button.active{color:var(--brand);font-weight:850}
/* modal */
.modal{position:fixed;z-index:200;inset:0;background:#0008;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--card);border-radius:27px 27px 0 0;padding:20px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{width:38px;height:38px;border-radius:12px;background:var(--bg);color:var(--text)}.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{padding:17px;border-radius:17px;background:var(--bg);text-align:center}.option b{display:block;margin-top:5px}
/* chat screen */
#chatScreen{display:none;position:fixed;inset:0;z-index:120;background:var(--bg);padding-bottom:74px}.chat-head{height:68px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:8px 12px}.back{width:42px;height:42px;border-radius:13px;background:var(--bg);font-size:25px;color:var(--text)}.chat-body{height:calc(100% - 130px);overflow:auto;padding:15px}.bubble{max-width:80%;padding:10px 13px;margin:7px 0;border-radius:17px;line-height:1.5;word-break:break-word}.bubble.me{margin-right:0;margin-left:auto;background:var(--brand);color:#fff;border-bottom-right-radius:5px}.bubble.them{margin-left:0;margin-right:auto;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}.bubble small{display:block;font-size:9px;opacity:.65;margin-top:4px}.chat-compose{position:absolute;bottom:0;right:0;left:0;height:62px;background:var(--card);border-top:1px solid var(--line);display:flex;gap:7px;padding:9px}.chat-compose input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:17px;padding:0 14px}.chat-compose button{width:44px;border-radius:14px;background:var(--brand);color:#fff}.chat-compose .attach{background:var(--soft);color:var(--brand)}
/* story viewer */
.story-view{position:fixed;inset:0;background:#08080d;z-index:300;display:none;color:#fff}.story-view.open{display:flex;flex-direction:column}.story-bar{padding:20px 15px;display:flex;gap:10px;align-items:center}.story-content{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:25px}.story-footer{padding:18px}.story-close{background:#fff2;color:#fff;border-radius:12px;padding:10px 15px}
/* notification badge */.badge{background:#e83b55;color:#fff;border-radius:99px;font-size:9px;padding:2px 6px;position:absolute;top:8px;margin-right:12px}
@media(min-width:700px){.main{padding-top:22px}.nav{max-width:760px;margin:auto;border-radius:22px 22px 0 0;left:50%;right:auto;width:760px;transform:translateX(-50%)}}
</style>
</head>
<body>

<section id="auth" class="screen center">
  <div class="auth-wrap">
    <div class="brand">Nexa<span>Chat</span></div>
    <div class="tag">مراسلة • أصدقاء • لحظات • مجتمع</div>
    <div class="auth-card">
      <div class="tabs"><button id="tabSignup" class="on">حساب جديد</button><button id="tabLogin">تسجيل الدخول</button></div>
      <div id="authErr" class="msg err"></div><div id="authOk" class="msg ok"></div>
      <div id="signupBox">
        <div class="field"><label>البريد الإلكتروني</label><input id="suEmail" type="email" autocomplete="email" placeholder="example@gmail.com"></div>
        <div class="field"><label>كلمة المرور</label><input id="suPass" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل"></div>
        <div class="field"><label>Nexa ID</label><input id="suUser" placeholder="Nour123" maxlength="20"></div>
        <div class="field"><label>الاسم الظاهر</label><input id="suName" placeholder="نور الدين" maxlength="30"></div>
        <button id="createBtn" class="primary">إنشاء الحساب</button>
        <button id="forgotFromSignup" class="ghost" style="width:100%;margin-top:8px">نسيت كلمة المرور؟</button>
      </div>
      <div id="loginBox" class="hidden">
        <div class="field"><label>البريد الإلكتروني</label><input id="liEmail" type="email" autocomplete="email" placeholder="example@gmail.com"></div>
        <div class="field"><label>كلمة المرور</label><input id="liPass" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
        <button id="loginBtn" class="primary">دخول إلى NexaChat</button>
        <button id="forgotBtn" class="ghost" style="width:100%;margin-top:8px">نسيت كلمة المرور؟</button>
      </div>
    </div>
  </div>
</section>

<section id="app" class="screen">
  <header class="top"><div class="top-row"><div id="pageTitle" class="top-title">المحادثات</div><button id="topSearch" class="top-action">⌕</button><button id="topBell" class="top-action">🔔</button></div></header>
  <main class="main">
    <section id="pageChats" class="page active">
      <div id="storiesArea"></div>
      <div class="section-head"><h2>المحادثات</h2><button id="newChatBtn" class="secondary">＋ محادثة</button></div>
      <div id="chatList" class="card"></div>
    </section>

    <section id="pageExplore" class="page">
      <div class="section-head"><h2>استكشاف</h2><button id="postBtn" class="secondary">＋ منشور</button></div>
      <div id="composer" class="card composer hidden">
        <div class="composer-row"><div id="composerAvatar" class="avatar small"></div><textarea id="postText" placeholder="إيه الجديد عندك؟"></textarea></div><div class="field" style="margin-top:10px"><input id="postImageUrl" placeholder="رابط صورة (اختياري)"></div>
        <div style="display:flex;gap:8px;margin-top:10px"><button id="publishBtn" class="primary" style="flex:1">نشر</button><button id="cancelPost" class="secondary">إلغاء</button></div>
      </div>
      <div id="feed"></div>
    </section>

    <section id="pageFriends" class="page">
      <div class="section-head"><h2>الأصدقاء</h2><button id="findFriend" class="secondary">🔎 بحث</button></div>
      <div id="friendList" class="card"></div>
      <div class="section-head" style="margin-top:22px"><h2>طلبات التواصل</h2></div>
      <div id="requestList" class="card"></div>
    </section>

    <section id="pageProfile" class="page">
      <div id="profileCard" class="card" style="overflow:hidden"></div>
      <div class="section-head"><h2>منشوراتي</h2></div><div id="myPosts"></div>
    </section>

    <section id="pageNotifications" class="page"><div class="section-head"><h2>الإشعارات</h2><button id="clearNotifs" class="secondary">مسح</button></div><div id="notifList" class="card"></div></section>
    <section id="pageSearch" class="page"><div class="section-head"><h2>بحث Nexa</h2></div><div class="searchbar"><input id="globalSearch" placeholder="ابحث بالـID أو الاسم"><button id="globalSearchBtn">⌕</button></div><div id="searchResults"></div></section>
  </main>
  <nav class="nav">
    <button data-page="chats" class="active"><i>💬</i>المحادثات</button>
    <button data-page="explore"><i>🌐</i>استكشاف</button>
    <button data-page="friends"><i>👥</i>الأصدقاء</button>
    <button data-page="profile"><i>👤</i>حسابي</button>
  </nav>
</section>

<section id="chatScreen">
  <div class="chat-head"><button id="chatBack" class="back">‹</button><div id="chatAvatar" class="avatar small"></div><div class="item-main"><div id="chatName" class="item-name"></div><div id="chatStatus" class="item-sub">متصل الآن</div></div><button id="chatMore" class="top-action">⋮</button></div>
  <div id="chatBody" class="chat-body"></div>
  <div class="chat-compose"><button id="attachBtn" class="attach">＋</button><input id="chatInput" placeholder="اكتب رسالة..."><button id="sendBtn">➤</button></div>
</section>

<div id="modal" class="modal"><div class="sheet"><div class="sheet-head"><b id="modalTitle">Nexa</b><button id="modalClose" class="close">×</button></div><div id="modalBody"></div></div></div>
<div id="storyView" class="story-view"><div class="story-bar"><div id="storyWho" style="flex:1;font-weight:800"></div><button id="storyClose" class="story-close">إغلاق</button></div><div id="storyContent" class="story-content"></div><div class="story-footer"><div id="storyTime" class="muted"></div></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
(function(){
const SUPABASE_URL='https://iyfvsgoqknrqijhcutxe.supabase.co';
const SUPABASE_KEY='sb_publishable_XwsQzXCCJskNPPqdztlvng_rI2Cjbkg';
const REDIRECT_URL=(location.protocol==='http:'||location.protocol==='https:') ? (location.origin+location.pathname) : null;
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let session=null, profile=null, selectedChatUser=null, selectedConversationId=null, chatChannel=null;
let cache={profiles:new Map(),posts:[],stories:[],friends:new Set(),requests:[],notifications:[],theme:localStorage.getItem('nexa_theme')||'light'};
const DEMOS=[];
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function initials(s){return (s||'?').trim().slice(0,1).toUpperCase();}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400);}
function msg(el,text){el.textContent=text;el.style.display=text?'block':'none';}
function authMsg(e,o=''){msg($('authErr'),e);msg($('authOk'),o);}
function me(){return profile;}
function isAdmin(){return !!session?.user?.app_metadata?.role && session.user.app_metadata.role==='admin';}
function avatarHTML(u,small=false){const c=small?'avatar small':'avatar';return `<div class="${c}">${u?.avatar_url?`<img src="${esc(u.avatar_url)}">`:esc(initials(u?.display_name||u?.name))}</div>`;}
function timeAgo(ts){const d=new Date(ts),mins=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));if(mins<1)return 'دلوقتي';if(mins<60)return `منذ ${mins} د`;const h=Math.floor(mins/60);if(h<24)return `منذ ${h} س`;return d.toLocaleDateString('ar-EG');}
function switchAuth(which){const sign=which==='signup';$('signupBox').classList.toggle('hidden',!sign);$('loginBox').classList.toggle('hidden',sign);$('tabSignup').classList.toggle('on',sign);$('tabLogin').classList.toggle('on',!sign);authMsg('','');}
function validUser(u){return /^[A-Za-z0-9_]{3,20}$/.test(u);}
async function createAccount(){
  authMsg('','');
  const email=$('suEmail').value.trim().toLowerCase(),pass=$('suPass').value,user=$('suUser').value.trim(),name=$('suName').value.trim();
  if(!email||!pass||!user||!name)return authMsg('من فضلك املأ كل البيانات.');
  if(pass.length<6)return authMsg('كلمة المرور لازم تكون 6 أحرف على الأقل.');
  if(!validUser(user))return authMsg('الـNexa ID من 3 إلى 20 حرفًا: إنجليزي/أرقام/_ فقط.');
  const {data:existing,error:lookupErr}=await sb.from('profiles').select('id').ilike('username',user).maybeSingle();
  if(lookupErr && lookupErr.code!=='PGRST116')return authMsg('تعذر التحقق من الـNexa ID. حاول مرة أخرى.');
  if(existing)return authMsg('الـNexa ID ده مستخدم بالفعل.');
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{username:user,display_name:name},...(REDIRECT_URL?{emailRedirectTo:REDIRECT_URL}:{})}});
  if(error)return authMsg(error.message.includes('already registered')?'البريد الإلكتروني مستخدم بالفعل.':error.message);
  $('suPass').value='';
  if(data.session){
    session=data.session;await startApp();toast('تم إنشاء الحساب بنجاح 🎉');
  }else{
    switchAuth('login');$('liEmail').value=email;authMsg('','تم إنشاء الحساب. افتح رسالة التأكيد في Gmail، وبعدها سجل الدخول.');
  }
}
async function login(){
  authMsg('','');
  const email=$('liEmail').value.trim().toLowerCase(),pass=$('liPass').value;
  if(!email||!pass)return authMsg('اكتب البريد وكلمة المرور.');
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)return authMsg(error.message.includes('Email not confirmed')?'لازم تؤكد البريد الإلكتروني الأول من Gmail.':'البريد الإلكتروني أو كلمة المرور غير صحيحة.');
  session=data.session;await startApp();toast('تم تسجيل الدخول ✓');
}
async function forgot(){
  const email=($('liEmail').value||$('suEmail').value).trim().toLowerCase();
  if(!email)return toast('اكتب البريد الإلكتروني الأول.');
  const {error}=await sb.auth.resetPasswordForEmail(email,REDIRECT_URL?{redirectTo:REDIRECT_URL}:undefined);
  if(error)return toast('تعذر إرسال رابط الاسترجاع.');
  toast('تم إرسال رابط استرجاع كلمة المرور إلى Gmail ✓');
}
async function logout(){await sb.auth.signOut();session=null;profile=null;if(chatChannel){await sb.removeChannel(chatChannel);chatChannel=null;}$('app').style.display='none';$('chatScreen').style.display='none';$('auth').style.display='flex';switchAuth('login');toast('تم تسجيل الخروج');}
async function startApp(){
  const {data:{session:s}}=await sb.auth.getSession();session=s||session;
  if(!session){$('auth').style.display='flex';return;}
  const ok=await loadProfile();if(!ok){await sb.auth.signOut();return;}
  $('auth').style.display='none';$('app').style.display='block';applyTheme();await loadAll();go('chats');
}
async function loadProfile(){
  const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!data){authMsg('الحساب موجود لكن ملف Nexa لم يكتمل. حاول تسجيل الدخول مرة أخرى.');return false;}
  profile=data;cache.profiles.set(data.id,data);return true;
}
async function loadAll(){await Promise.all([loadProfiles(),loadFeed(),loadStories(),loadRequestsAndFriends(),loadNotifications()]);renderAll();}
async function loadProfiles(){
  const {data,error}=await sb.from('profiles').select('id,username,display_name,avatar_url,bio').limit(1000);
  if(!error)(data||[]).forEach(p=>cache.profiles.set(p.id,p));
}
async function loadFeed(){
  const {data,error}=await sb.from('posts').select('id,author_id,body,image_url,visibility,created_at,updated_at').eq('visibility','published').order('created_at',{ascending:false}).limit(50);
  if(error){toast('تعذر تحميل الاستكشاف');return;}
  const posts=data||[],ids=posts.map(p=>p.id);
  if(!ids.length){cache.posts=[];return;}
  const [{data:likes},{data:comments}]=await Promise.all([
    sb.from('post_likes').select('post_id,user_id').in('post_id',ids),
    sb.from('post_comments').select('id,post_id,user_id,body,created_at').in('post_id',ids).order('created_at',{ascending:true})
  ]);
  cache.posts=posts.map(p=>({...p,likes:(likes||[]).filter(x=>x.post_id===p.id),comments:(comments||[]).filter(x=>x.post_id===p.id)}));
}
async function loadStories(){
  const {data,error}=await sb.from('stories').select('id,author_id,body,created_at,expires_at').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(100);
  if(!error)cache.stories=data||[];
}
async function loadRequestsAndFriends(){
  const uid=session.user.id;
  const {data:rs}=await sb.from('contact_requests').select('id,sender_id,receiver_id,status,created_at,updated_at').or(`sender_id.eq.${uid},receiver_id.eq.${uid}`).order('created_at',{ascending:false});
  cache.requests=rs||[];cache.friends=new Set();cache.requests.filter(r=>r.status==='accepted').forEach(r=>cache.friends.add(r.sender_id===uid?r.receiver_id:r.sender_id));
}
async function loadNotifications(){cache.notifications=[];}
function friend(id){return cache.friends.has(id);}
function requestFor(id){return cache.requests.find(r=>(r.sender_id===session.user.id&&r.receiver_id===id)||(r.receiver_id===session.user.id&&r.sender_id===id));}
function go(page){
  const map={chats:'pageChats',explore:'pageExplore',friends:'pageFriends',profile:'pageProfile',notifications:'pageNotifications',search:'pageSearch'};
  Object.values(map).forEach(id=>$(id).classList.remove('active'));$(map[page]).classList.add('active');
  const titles={chats:'المحادثات',explore:'استكشاف',friends:'الأصدقاء',profile:'حسابي',notifications:'الإشعارات',search:'بحث Nexa'};$('pageTitle').textContent=titles[page]||'NexaChat';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));renderAll();
  if(page==='explore')loadFeed().then(renderFeed);
}
function renderAll(){if(!me())return;renderStories();renderChats();renderFeed();renderFriends();renderRequests();renderProfile();renderNotifications();$('composerAvatar').textContent=initials(me().display_name);}
function renderStories(){
  const rows=cache.stories.filter(s=>new Date(s.expires_at)>new Date());
  let html='<div class="section-head"><h2>القصص</h2><button id="addStory" class="secondary">＋ قصتي</button></div><div class="story-row"><div class="story add" id="myStoryAdd"><div class="story-ring"><div>＋</div></div><small>قصتي</small></div>';
  rows.forEach(s=>{const u=cache.profiles.get(s.author_id);if(!u)return;html+=`<div class="story" data-story="${s.id}"><div class="story-ring">${avatarHTML(u,true)}</div><small>${esc(u.display_name)}</small></div>`});html+='</div>';
  $('storiesArea').innerHTML=html;$('addStory').onclick=addStory;$('myStoryAdd').onclick=addStory;document.querySelectorAll('[data-story]').forEach(x=>x.onclick=()=>viewStory(x.dataset.story));
}
function addStory(){openModal('إضافة Story',`<div class="field"><label>اكتب لحظتك</label><textarea id="storyText" maxlength="1000" placeholder="إيه اللي بيحصل دلوقتي؟"></textarea></div><button id="storySave" class="primary">نشر القصة</button>`);$('storySave').onclick=async()=>{const body=$('storyText').value.trim();if(!body)return toast('اكتب حاجة الأول');const {error}=await sb.from('stories').insert({author_id:session.user.id,body});if(error)return toast('تعذر نشر الـStory');closeModal();await loadStories();renderStories();toast('تم نشر الـStory ✓');};}
function viewStory(id){const s=cache.stories.find(x=>x.id===id);if(!s)return;const u=cache.profiles.get(s.author_id);$('storyWho').textContent=(u?.display_name||'Nexa user')+'  @'+(u?.username||'');$('storyContent').textContent=s.body;$('storyTime').textContent=timeAgo(s.created_at);$('storyView').classList.add('open');}
async function loadChatList(){
  const {data:members,error}=await sb.from('conversation_members').select('conversation_id,user_id').eq('user_id',session.user.id);if(error)return [];
  const ids=(members||[]).map(x=>x.conversation_id);if(!ids.length)return [];
  const {data:allm}=await sb.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids);const others=(allm||[]).filter(x=>x.user_id!==session.user.id);
  const rows=[];for(const m of others){const {data:msgs}=await sb.from('messages').select('body,created_at,sender_id').eq('conversation_id',m.conversation_id).order('created_at',{ascending:false}).limit(1);rows.push({conversation_id:m.conversation_id,user_id:m.user_id,last:msgs?.[0]||null});}return rows;
}
async function renderChats(){const list=$('chatList');const rows=await loadChatList();if(!rows.length){list.innerHTML='<div class="center" style="padding:45px 15px;text-align:center"><div><div style="font-size:38px">💬</div><b>لسه مفيش محادثات</b><div class="muted" style="margin-top:7px">ابدأ بطلب تواصل من البحث.</div></div></div>';return;}list.innerHTML=rows.map(r=>{const u=cache.profiles.get(r.user_id)||{display_name:'Nexa user',username:'user'};return `<div class="chat-item" data-chat-id="${r.user_id}">${avatarHTML(u)}<div class="item-main"><div class="item-name">${esc(u.display_name)}</div><div class="item-sub">${esc(r.last?.body||'ابدأ المحادثة')}</div></div><div class="time">${r.last?timeAgo(r.last.created_at):''}</div></div>`}).join('');list.querySelectorAll('[data-chat-id]').forEach(x=>x.onclick=()=>openChat(x.dataset.chatId));}
async function openChat(userId){
  if(!friend(userId))return toast('لازم طلب التواصل يتقبل الأول.');
  const u=cache.profiles.get(userId);if(!u)return;
  const {data,error}=await sb.functions.invoke('start-private-chat',{body:{user_id:userId}});if(error||!data?.conversation_id)return toast(data?.error||'تعذر فتح المحادثة');
  selectedChatUser=u;selectedConversationId=data.conversation_id;$('app').style.display='none';$('chatScreen').style.display='block';$('chatAvatar').textContent=initials(u.display_name);$('chatName').textContent=u.display_name;$('chatStatus').textContent='@'+u.username;await renderChatBody();subscribeChat();}
async function renderChatBody(){if(!selectedConversationId)return;const {data,error}=await sb.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',selectedConversationId).order('created_at',{ascending:true});const box=$('chatBody');if(error){box.innerHTML='<div class="center">تعذر تحميل الرسائل</div>';return;}box.innerHTML=(data||[]).map(m=>`<div class="bubble ${m.sender_id===session.user.id?'me':'them'}">${esc(m.body)}<small>${new Date(m.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<div class="center" style="height:100%"><div class="muted">ابدأ أول رسالة 👋</div></div>';box.scrollTop=box.scrollHeight;}
function subscribeChat(){if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null;}chatChannel=sb.channel('nexa-chat-'+selectedConversationId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${selectedConversationId}`},()=>renderChatBody()).subscribe();}
async function sendMessage(){const input=$('chatInput'),body=input.value.trim();if(!body||!selectedConversationId)return;const {error}=await sb.from('messages').insert({conversation_id:selectedConversationId,sender_id:session.user.id,body});if(error)return toast('تعذر إرسال الرسالة');input.value='';await renderChatBody();}
function closeChat(){if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null;}selectedChatUser=null;selectedConversationId=null;$('chatScreen').style.display='none';$('app').style.display='block';go('chats');}
async function renderFeed(){
  const feed=$('feed');if(!cache.posts.length){feed.innerHTML='<div class="card" style="padding:35px;text-align:center"><div style="font-size:35px">🌐</div><b>لسه مفيش منشورات</b><div class="muted" style="margin-top:7px">كن أول شخص ينشر في Nexa.</div></div>';return;}
  feed.innerHTML=cache.posts.map(postHTML).join('');bindPostActions();
}
function postHTML(p){
  const u=cache.profiles.get(p.author_id)||{display_name:'Nexa user',username:'user'};const liked=p.likes.some(x=>x.user_id===session.user.id);const comments=p.comments||[];
  return `<article class="post card"><div class="post-head">${avatarHTML(u,true)}<div class="item-main"><div class="item-name">${esc(u.display_name)}</div><div class="item-sub">@${esc(u.username)} • ${timeAgo(p.created_at)}</div></div><button class="top-action" data-report="${p.id}" title="إبلاغ">⋮</button></div><div class="post-body">${esc(p.body)}</div>${p.image_url?`<img class="post-media" src="${esc(p.image_url)}">`:''}<div class="post-actions"><button data-like="${p.id}" class="${liked?'active':''}">❤️ ${p.likes.length}</button><button data-comment="${p.id}">💬 ${comments.length}</button><button data-share="${p.id}">↗️ مشاركة</button></div>${comments.length?`<div class="comments">${comments.slice(-4).map(c=>{const cu=cache.profiles.get(c.user_id);return `<div class="comment"><b>${esc(cu?.display_name||'Nexa user')}</b>${esc(c.body)}</div>`}).join('')}</div>`:''}</article>`;
}
function bindPostActions(){document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>likePost(b.dataset.like));document.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>commentPost(b.dataset.comment));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>sharePost(b.dataset.share));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>reportPost(b.dataset.report));}
async function publish(){const body=$('postText').value.trim(),image=$('postImageUrl').value.trim();if(!body)return toast('اكتب محتوى المنشور');if(body.length>5000)return toast('المنشور طويل جدًا');const {error}=await sb.from('posts').insert({author_id:session.user.id,body,image_url:image||null});if(error)return toast(error.message.includes('banned')?'الحساب موقوف عن النشر.':'تعذر نشر المنشور');$('postText').value='';$('postImageUrl').value='';$('composer').classList.add('hidden');await loadFeed();renderFeed();toast('تم نشر المنشور للجميع ✓');}
async function likePost(id){const p=cache.posts.find(x=>x.id===id);if(!p)return;const liked=p.likes.some(x=>x.user_id===session.user.id);const q=liked?sb.from('post_likes').delete().eq('post_id',id).eq('user_id',session.user.id):sb.from('post_likes').insert({post_id:id,user_id:session.user.id});const {error}=await q;if(error)return toast('تعذر تحديث الإعجاب');await loadFeed();renderFeed();}
async function commentPost(id){openModal('تعليق',`<div class="field"><label>تعليقك</label><textarea id="commentText" maxlength="1000" placeholder="اكتب تعليقك..."></textarea></div><button id="commentSave" class="primary">إضافة التعليق</button>`);$('commentSave').onclick=async()=>{const body=$('commentText').value.trim();if(!body)return;const {error}=await sb.from('post_comments').insert({post_id:id,user_id:session.user.id,body});if(error)return toast('تعذر إضافة التعليق');closeModal();await loadFeed();renderFeed();toast('تم إضافة التعليق ✓');};}
async function sharePost(id){const p=cache.posts.find(x=>x.id===id);if(!p)return;const text=`منشور على NexaChat\n@${cache.profiles.get(p.author_id)?.username||''}\n\n${p.body}`;try{if(navigator.share)await navigator.share({title:'NexaChat',text});else{await navigator.clipboard.writeText(text);toast('تم نسخ المنشور ✓');}}catch(e){}}
function reportPost(id){openModal('إبلاغ عن المنشور',`<div class="field"><label>سبب البلاغ</label><select id="reportReason"><option value="محتوى إباحي أو عُري">محتوى إباحي أو عُري</option><option value="إساءة أو تنمر">إساءة أو تنمر</option><option value="كراهية أو تحريض">كراهية أو تحريض</option><option value="عنف أو تهديد">عنف أو تهديد</option><option value="احتيال أو تضليل">احتيال أو تضليل</option><option value="محتوى مخالف آخر">محتوى مخالف آخر</option></select></div><div class="field"><label>تفاصيل إضافية (اختياري)</label><textarea id="reportDetails" maxlength="2000" placeholder="اشرح المشكلة باختصار"></textarea></div><button id="sendReport" class="primary">إرسال البلاغ</button>`);$('sendReport').onclick=async()=>{const reason=$('reportReason').value,details=$('reportDetails').value.trim();const {error}=await sb.from('post_reports').insert({post_id:id,reporter_id:session.user.id,reason,details:details||null});if(error){toast(error.code==='23505'?'أنت أبلغت عن المنشور ده بالفعل.':'تعذر إرسال البلاغ');return;}closeModal();toast('تم إرسال البلاغ للمراجعة ✓');};}
async function renderFriends(){const box=$('friendList'),ids=[...cache.friends];if(!ids.length){box.innerHTML='<div style="padding:25px;text-align:center" class="muted">لسه مفيش أصدقاء. ابحث عن Nexa ID وابعث طلب تواصل.</div>';return;}box.innerHTML=ids.map(id=>{const u=cache.profiles.get(id);if(!u)return '';return `<div class="person-item">${avatarHTML(u,true)}<div class="item-main"><div class="item-name">${esc(u.display_name)}</div><div class="item-sub">@${esc(u.username)}</div></div><button class="secondary" data-fchat="${id}">💬 رسالة</button></div>`}).join('');box.querySelectorAll('[data-fchat]').forEach(b=>b.onclick=()=>openChat(b.dataset.fchat));}
async function renderRequests(){const box=$('requestList'),uid=session.user.id,incoming=cache.requests.filter(r=>r.receiver_id===uid&&r.status==='pending');if(!incoming.length){box.innerHTML='<div style="padding:25px;text-align:center" class="muted">مفيش طلبات جديدة.</div>';return;}box.innerHTML=incoming.map(r=>{const u=cache.profiles.get(r.sender_id)||{display_name:'Nexa user',username:'user'};return `<div class="request-item">${avatarHTML(u,true)}<div class="item-main"><div class="item-name">${esc(u.display_name)}</div><div class="item-sub">@${esc(u.username)}</div></div><button class="secondary" data-accept="${r.id}">قبول</button><button class="block" data-reject="${r.id}">رفض</button></div>`}).join('');box.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>acceptRequest(b.dataset.accept));box.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>rejectRequest(b.dataset.reject));}
async function sendRequest(userId){if(userId===session.user.id)return toast('مينفعش تبعت طلب لنفسك');if(friend(userId))return toast('أنتم أصدقاء بالفعل');const r=requestFor(userId);if(r&&r.status==='pending')return toast('في طلب تواصل معلّق بالفعل');const {error}=await sb.from('contact_requests').insert({sender_id:session.user.id,receiver_id:userId,status:'pending'});if(error)return toast(error.code==='23505'?'في طلب موجود بالفعل.':'تعذر إرسال طلب التواصل');await loadRequestsAndFriends();renderAll();toast('تم إرسال طلب التواصل ✓');}
async function acceptRequest(id){const {error}=await sb.from('contact_requests').update({status:'accepted'}).eq('id',id).eq('receiver_id',session.user.id).eq('status','pending');if(error)return toast('تعذر قبول الطلب');await loadRequestsAndFriends();renderAll();toast('تم قبول الطلب ✓');}
async function rejectRequest(id){const {error}=await sb.from('contact_requests').update({status:'rejected'}).eq('id',id).eq('receiver_id',session.user.id).eq('status','pending');if(error)return toast('تعذر رفض الطلب');await loadRequestsAndFriends();renderAll();toast('تم رفض الطلب');}
async function globalSearch(){const q=$('globalSearch').value.trim();if(!q)return toast('اكتب كلمة للبحث');const {data,error}=await sb.from('profiles').select('id,username,display_name,avatar_url,bio').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).neq('id',session.user.id).limit(30);if(error)return toast('تعذر البحث');(data||[]).forEach(p=>cache.profiles.set(p.id,p));const rs=data||[];$('searchResults').innerHTML=rs.length?rs.map(u=>{const fr=friend(u.id),r=requestFor(u.id);return `<div class="result-card card"><div style="display:flex;gap:10px;align-items:center">${avatarHTML(u,true)}<div class="item-main"><div class="item-name">${esc(u.display_name)}</div><div class="item-sub">@${esc(u.username)} • ${esc(u.bio||'Nexa user')}</div></div></div><div class="result-actions">${fr?'<button class="secondary" disabled>صديق ✓</button>':r?.status==='pending'?'<button class="secondary" disabled>طلب معلّق</button>':`<button class="follow" data-add="${u.id}">＋ إضافة</button>`}<button class="secondary" data-open="${u.id}">💬 محادثة</button><button class="block" data-block="${u.id}">🚫 حظر</button><button class="block" data-user-report="${u.id}">⚑ إبلاغ</button></div></div>`}).join(''):'<div class="card" style="padding:30px;text-align:center" class="muted">مفيش نتائج.</div>';$('searchResults').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>sendRequest(b.dataset.add));$('searchResults').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openChat(b.dataset.open));$('searchResults').querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>blockUser(b.dataset.block));$('searchResults').querySelectorAll('[data-user-report]').forEach(b=>b.onclick=()=>reportUser(b.dataset.userReport));}
function reportUser(id){openModal('إبلاغ عن حساب',`<div class="field"><label>سبب البلاغ</label><select id="userReportReason"><option>إساءة أو تنمر</option><option>حساب مزعج أو احتيالي</option><option>محتوى إباحي</option><option>تهديد أو تحريض</option><option>سبب آخر</option></select></div><div class="field"><label>تفاصيل</label><textarea id="userReportDetails" maxlength="2000"></textarea></div><button id="sendUserReport" class="primary">إرسال البلاغ</button>`);$('sendUserReport').onclick=async()=>{const {error}=await sb.from('user_reports').insert({reporter_id:session.user.id,reported_id:id,reason:$('userReportReason').value,details:$('userReportDetails').value.trim()||null});if(error)return toast('تعذر إرسال البلاغ');closeModal();toast('تم إرسال البلاغ ✓');};}
async function renderProfile(){const u=me();if(!u)return;const {count:friends}=await sb.from('contact_requests').select('id',{count:'exact',head:true}).or(`and(sender_id.eq.${session.user.id},status.eq.accepted),and(receiver_id.eq.${session.user.id},status.eq.accepted)`);const {count:posts}=await sb.from('posts').select('id',{count:'exact',head:true}).eq('author_id',session.user.id);$('profileCard').innerHTML=`<div class="profile-cover"></div><div class="profile-body">${avatarHTML(u)}<h2 style="margin:8px 0 0">${esc(u.display_name)}</h2><div class="profile-id">@${esc(u.username)}</div><p class="muted">${esc(u.bio||'مفيش نبذة لسه.')}</p><div class="stats"><div class="stat"><b>${friends||0}</b><span class="muted">أصدقاء</span></div><div class="stat"><b>${posts||0}</b><span class="muted">منشورات</span></div><div class="stat"><b>${cache.stories.filter(s=>s.author_id===session.user.id).length}</b><span class="muted">Stories</span></div></div><div class="profile-actions"><button id="editProfile" class="secondary">✏️ تعديل الحساب</button><button id="themeBtn" class="secondary">🌓 الوضع الليلي</button><button id="settingsBtn" class="secondary">⚙️ الإعدادات</button>${isAdmin()?'<button id="adminBtn" class="secondary">🛡️ لوحة الإدارة</button>':''}<button id="logoutBtn" class="block">تسجيل الخروج</button></div></div>`;$('editProfile').onclick=editProfile;$('themeBtn').onclick=toggleTheme;$('settingsBtn').onclick=settings;$('logoutBtn').onclick=logout;if(isAdmin())$('adminBtn').onclick=adminPanel;const mine=cache.posts.filter(p=>p.author_id===session.user.id);$('myPosts').innerHTML=mine.length?mine.map(postHTML).join(''):'<div class="card" style="padding:30px;text-align:center" class="muted">مفيش منشورات.</div>';bindPostActions();}
function editProfile(){const u=me();openModal('تعديل الحساب',`<div class="field"><label>الاسم الظاهر</label><input id="editName" value="${esc(u.display_name)}"></div><div class="field"><label>النبذة</label><textarea id="editBio" maxlength="500">${esc(u.bio||'')}</textarea></div><button id="saveProfile" class="primary">حفظ</button>`);$('saveProfile').onclick=async()=>{const n=$('editName').value.trim(),bio=$('editBio').value.trim();if(!n)return toast('الاسم مطلوب');const {data,error}=await sb.from('profiles').update({display_name:n,bio}).eq('id',session.user.id).select('*').single();if(error)return toast('تعذر حفظ البيانات');profile=data;cache.profiles.set(data.id,data);closeModal();renderAll();toast('تم تحديث الحساب ✓');};}
function settings(){openModal('إعدادات NexaChat',`<div class="option-grid"><button id="privacyOpt" class="option">🔐<b>الخصوصية</b><small class="muted">الحظر والبلاغات</small></button><button id="notifOpt" class="option">🔔<b>الإشعارات</b><small class="muted">تنبيهات التطبيق</small></button><button id="blockedOpt" class="option">🚫<b>المحظورون</b><small class="muted">إدارة الحسابات</small></button><button id="aboutOpt" class="option">ℹ️<b>عن Nexa</b><small class="muted">حساب حقيقي عبر Supabase</small></button></div>`);$('privacyOpt').onclick=()=>toast('الخصوصية الأساسية شغالة من السيرفر');$('notifOpt').onclick=()=>toast('إشعارات الجهاز Push هنضيفها في مرحلة لاحقة');$('blockedOpt').onclick=showBlocked;$('aboutOpt').onclick=()=>toast('NexaChat — Real backend edition');}
async function showBlocked(){const {data,error}=await sb.from('user_blocks').select('blocked_id').eq('blocker_id',session.user.id);if(error)return toast('تعذر تحميل المحظورين');const html=(data||[]).map(x=>{const u=cache.profiles.get(x.blocked_id);return `<div class="person-item"><div class="item-main"><b>@${esc(u?.username||'user')}</b></div><button class="secondary" data-unblock="${x.blocked_id}">إلغاء الحظر</button></div>`}).join('')||'<div class="muted" style="padding:20px;text-align:center">مفيش حسابات محظورة.</div>';openModal('الحسابات المحظورة',html);document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{await sb.from('user_blocks').delete().eq('blocker_id',session.user.id).eq('blocked_id',b.dataset.unblock);showBlocked();});}
function toggleTheme(){cache.theme=cache.theme==='dark'?'light':'dark';localStorage.setItem('nexa_theme',cache.theme);applyTheme();toast(cache.theme==='dark'?'الوضع الليلي مفعل':'الوضع النهاري مفعل');}
function applyTheme(){document.body.classList.toggle('dark',cache.theme==='dark');}
async function blockUser(id){const {error}=await sb.from('user_blocks').upsert({blocker_id:session.user.id,blocked_id:id});if(error)return toast('تعذر حظر الحساب');toast('تم حظر الحساب');closeModal();}
async function adminPanel(){const {data:reports,error}=await sb.from('post_reports').select('id,post_id,reporter_id,reason,details,status,created_at').order('created_at',{ascending:false}).limit(50);if(error)return toast('تعذر تحميل البلاغات');const ids=[...(reports||[]).map(r=>r.post_id)];let posts=[];if(ids.length){const q=await sb.from('posts').select('id,author_id,body,visibility,created_at').in('id',ids);posts=q.data||[];}const pm=new Map(posts.map(p=>[p.id,p]));const html=(reports||[]).map(r=>{const p=pm.get(r.post_id);return `<div class="card" style="padding:14px;margin-bottom:10px"><b>🚨 ${esc(r.reason)}</b><div class="item-sub">${new Date(r.created_at).toLocaleString('ar-EG')} • الحالة: ${esc(r.status)}</div><p style="white-space:pre-wrap">${esc(p?.body||'المنشور غير موجود')}</p><div class="result-actions"><button class="secondary" data-review="${r.id}">مراجعة</button>${p?`<button class="block" data-hide="${p.id}">${p.visibility==='published'?'إخفاء المنشور':'إظهار المنشور'}</button>`:''}</div></div>`}).join('')||'<div class="muted" style="padding:20px;text-align:center">مفيش بلاغات.</div>';openModal('🛡️ لوحة إدارة البلاغات',html);document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{await sb.from('post_reports').update({status:'reviewed'}).eq('id',b.dataset.review);adminPanel();});document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{const p=posts.find(x=>x.id===b.dataset.hide);if(!p)return;const next=p.visibility==='published'?'hidden':'published';await sb.from('posts').update({visibility:next,moderation_reason:next==='hidden'?'مراجعة إدارية':''}).eq('id',p.id);await loadFeed();adminPanel();});}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('open');}
function closeModal(){$('modal').classList.remove('open');$('modalBody').innerHTML='';}
function addFriendSearch(){go('search');$('globalSearch').focus();}
function attach(){openModal('إرسال ملف',`<div class="muted" style="padding:10px 0">رفع الملفات الحقيقي هيتم عبر Supabase Storage في المرحلة القادمة. دلوقتي المحادثة النصية شغالة فعليًا.</div>`);}
function renderNotifications(){const n=$('notifList');n.innerHTML='<div style="padding:30px;text-align:center" class="muted">الإشعارات اللحظية هنربطها في المرحلة القادمة.</div>';}
function bind(){
 $('tabSignup').onclick=()=>switchAuth('signup');$('tabLogin').onclick=()=>switchAuth('login');$('createBtn').onclick=createAccount;$('loginBtn').onclick=login;$('forgotBtn').onclick=forgot;$('forgotFromSignup').onclick=forgot;
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('topSearch').onclick=()=>go('search');$('topBell').onclick=()=>go('notifications');$('newChatBtn').onclick=newChat;$('findFriend').onclick=addFriendSearch;$('globalSearchBtn').onclick=globalSearch;$('globalSearch').onkeydown=e=>{if(e.key==='Enter')globalSearch()};$('postBtn').onclick=()=>{$('composer').classList.toggle('hidden');$('postText').focus()};$('cancelPost').onclick=()=>{$('composer').classList.add('hidden')};$('publishBtn').onclick=publish;$('chatBack').onclick=closeChat;$('sendBtn').onclick=sendMessage;$('chatInput').onkeydown=e=>{if(e.key==='Enter')sendMessage()};$('attachBtn').onclick=attach;$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('storyClose').onclick=()=>$('storyView').classList.remove('open');
}
function newChat(){go('search');$('globalSearch').focus();toast('ابحث عن Nexa ID للشخص اللي عايز تكلمه');}
async function boot(){
  bind();applyTheme();
  const {data:{session:s}}=await sb.auth.getSession();session=s;
  sb.auth.onAuthStateChange(async(event,s2)=>{session=s2;if(event==='SIGNED_OUT'){profile=null;$('app').style.display='none';$('chatScreen').style.display='none';$('auth').style.display='flex';switchAuth('login');} });
  if(session){await startApp();}else{$('auth').style.display='flex';switchAuth('signup');}
}
boot();
})();
</script>
</body>
</html>
